services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docubot-db
    environment:
      POSTGRES_USER: docubot
      POSTGRES_PASSWORD: docubot
      POSTGRES_DB: docubot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: